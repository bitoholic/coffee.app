name: CI

on:
  pull_request:
    branches:
      - develop

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.parallel=true

jobs:
  test:
    name: JVM Tests & Coverage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Run tests with coverage
        # Note: uses `test` not `check` — lint crashes with IncompatibleClassChangeError
        run: ./gradlew test koverXmlReport koverHtmlReport koverVerify

      - name: Upload coverage report (HTML + XML)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: composeApp/build/reports/kover/

      - name: Archive test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: composeApp/build/reports/tests/

      - name: Comment coverage on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            try {
              const xml = fs.readFileSync('composeApp/build/reports/kover/report.xml', 'utf8');
              const match = [...xml.matchAll(/counter.*?missed="(\d+)".*?covered="(\d+)"/g)];
              let missed = 0, covered = 0;
              match.forEach(m => { missed += parseInt(m[1]); covered += parseInt(m[2]); });
              const total = missed + covered;
              const pct = total > 0 ? (covered / total * 100).toFixed(1) : '0.0';
              const threshold = 18;
              const status = parseFloat(pct) >= threshold ? '✅' : '❌';
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: `## ${status} Coverage Report\n\n**${pct}%** line coverage (${covered}/${total} lines)\n\nThreshold: **${threshold}%** (koverVerify fails below this)`
              });
            } catch (e) {
              console.log('Could not post coverage comment:', e.message);
            }
